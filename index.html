<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Portal Guru">
<meta name="application-name" content="Portal Guru">
<meta name="description" content="Portal Guru — Teacher Command Center">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Portal Guru</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1020}
body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#app{position:fixed;inset:0;width:100%;height:100dvh;height:100svh;background:#0b1020}
#portal{display:block;border:0;width:100%;height:100%;min-height:100%;background:#f8fafc}
#splash{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:24px;
background:radial-gradient(circle at 50% 20%,#27356b 0,#10162d 42%,#070b16 100%);transition:opacity .35s ease,visibility .35s ease}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
.brand{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.logo{width:88px;height:88px;border-radius:26px;box-shadow:0 20px 60px rgba(79,70,229,.35);animation:float 2.2s ease-in-out infinite}
.title{font-size:18px;font-weight:900;letter-spacing:.02em;color:#fff}.sub{font-size:12px;color:#a5b4fc;font-weight:700}
.loader{width:32px;height:32px;border-radius:50%;border:3px solid rgba(255,255,255,.18);border-top-color:#818cf8;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes float{50%{transform:translateY(-5px)}}
</style>
</head>
<body>
<div id="app"><iframe id="portal" title="Portal Guru" allow="fullscreen; clipboard-read; clipboard-write"></iframe></div>
<div id="splash"><div class="brand"><img class="logo" src="./icon-512.png" alt=""><div class="title">PORTAL GURU</div><div class="sub">Teacher Command Center</div><div class="loader"></div></div></div>
<script>
const PORTAL_URL = "https://script.google.com/macros/s/AKfycbx-hiYq6ms1E5_66HQVvFmHd7cYyTukONcWw9llO9F9flW3Q52AeH0snmZR1_s-jdMO/exec?app=guru";
const frame=document.getElementById('portal'), splash=document.getElementById('splash');
frame.src=PORTAL_URL;
frame.addEventListener('load',()=>setTimeout(()=>splash.classList.add('hide'),250));
setTimeout(()=>splash.classList.add('hide'),9000);
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));}
</script>
</body>
</html>
